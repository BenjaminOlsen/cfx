[package]
name = "cfx"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for cfx - arbitrary precision integers and cryptographic operations"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"

[lib]
name = "cfx"
path = "src/lib.rs"

[build-dependencies]
cc = "1.0"
bindgen = { version = "0.68", optional = true }

[dev-dependencies]
rand = "0.8"

[features]
default = []
# Generate fresh bindings (requires libclang)
regenerate-bindings = ["bindgen"]

[[example]]
name = "find_prime"
path = "examples/find_prime.rs"
